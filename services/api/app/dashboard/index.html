<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        Global Moringa Distributor Intelligence
    </title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            background: #f5f7fb;
            color: #1f2937;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 24px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            margin-bottom: 24px;
        }

        .header h1 {
            margin: 0;
            font-size: 28px;
        }

        .header p {
            margin: 6px 0 0;
            color: #6b7280;
        }

        .status {
            padding: 8px 14px;
            border-radius: 20px;
            background: #dcfce7;
            color: #166534;
            font-size: 13px;
            font-weight: 600;
        }

        .stats {
            display: grid;
            grid-template-columns:
                repeat(4, minmax(0, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .stat-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.05);
        }

        .stat-label {
            color: #6b7280;
            font-size: 14px;
            margin-bottom: 8px;
        }

        .stat-value {
            font-size: 30px;
            font-weight: 700;
        }

        .high {
            color: #dc2626;
        }

        .good {
            color: #d97706;
        }

        .possible {
            color: #2563eb;
        }

        .filters {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.05);
            margin-bottom: 20px;
        }

        .filter-grid {
            display: grid;
            grid-template-columns:
                2fr 1fr 1fr 1fr auto;
            gap: 12px;
        }

        input,
        select,
        button {
            width: 100%;
            padding: 11px 13px;
            border-radius: 8px;
            border: 1px solid #d1d5db;
            font-size: 14px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            cursor: pointer;
            border: none;
            background: #2563eb;
            color: white;
            font-weight: 600;
        }

        button:hover {
            background: #1d4ed8;
        }

        .secondary-button {
            background: #6b7280;
        }

        .secondary-button:hover {
            background: #4b5563;
        }

        .table-container {
            background: white;
            border-radius: 12px;
            overflow-x: auto;
            box-shadow:
                0 2px 8px rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            min-width: 850px;
        }

        th,
        td {
            padding: 14px 16px;
            text-align: left;
            border-bottom: 1px solid #e5e7eb;
        }

        th {
            background: #f9fafb;
            color: #6b7280;
            font-size: 13px;
            text-transform: uppercase;
        }

        td {
            font-size: 14px;
        }

        tr:hover td {
            background: #f9fafb;
        }

        .company {
            font-weight: 600;
        }

        .score {
            font-weight: 700;
        }

        .badge {
            display: inline-block;
            padding: 5px 9px;
            border-radius: 14px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-high {
            background: #fee2e2;
            color: #991b1b;
        }

        .badge-good {
            background: #fef3c7;
            color: #92400e;
        }

        .badge-possible {
            background: #dbeafe;
            color: #1e40af;
        }

        .open-button {
            width: auto;
            padding: 7px 12px;
            font-size: 13px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 16px;
        }

        .results-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .results-count {
            color: #6b7280;
            font-size: 14px;
        }

        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 1000;
        }

        .modal-overlay.active {
            display: flex;
        }

        .modal {
            background: white;
            width: 100%;
            max-width: 850px;
            max-height: 90vh;
            overflow-y: auto;
            border-radius: 14px;
            padding: 24px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            margin: 0;
        }

        .close-button {
            width: auto;
            background: #e5e7eb;
            color: #374151;
            padding: 7px 12px;
        }

        .close-button:hover {
            background: #d1d5db;
        }

        .lead-section {
            margin-top: 24px;
        }

        .lead-section h3 {
            margin-bottom: 12px;
            font-size: 16px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns:
                repeat(2, minmax(0, 1fr));
            gap: 12px;
        }

        .detail {
            background: #f9fafb;
            padding: 12px;
            border-radius: 8px;
        }

        .detail-label {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 4px;
        }

        .detail-value {
            font-weight: 600;
            word-break: break-word;
        }

        .signals {
            padding: 14px;
            background: #f9fafb;
            border-radius: 8px;
            white-space: pre-wrap;
        }

        .empty {
            text-align: center;
            padding: 40px;
            color: #6b7280;
        }

        @media (max-width: 900px) {

            .stats {
                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .filter-grid {
                grid-template-columns: 1fr 1fr;
            }

            .header {
                align-items: flex-start;
                flex-direction: column;
            }
        }

        @media (max-width: 600px) {

            .container {
                padding: 14px;
            }

            .stats {
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }

            .stat-card {
                padding: 14px;
            }

            .stat-value {
                font-size: 24px;
            }

            .filter-grid {
                grid-template-columns: 1fr;
            }

            .detail-grid {
                grid-template-columns: 1fr;
            }

            .modal {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <div>
            <h1>
                Global Moringa Distributor Intelligence
            </h1>

            <p>
                Australian buyer discovery and lead intelligence
            </p>
        </div>

        <div class="status">
            ● PostgreSQL Connected
        </div>

    </div>


    <!-- ===================================================== -->
    <!-- STATS -->
    <!-- ===================================================== -->

    <div class="stats">

        <div class="stat-card">
            <div class="stat-label">
                Total Leads
            </div>

            <div
                class="stat-value"
                id="totalCandidates"
            >
                —
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-label">
                High Potential
            </div>

            <div
                class="stat-value high"
                id="highPotential"
            >
                —
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-label">
                Good Potential
            </div>

            <div
                class="stat-value good"
                id="goodPotential"
            >
                —
            </div>
        </div>


        <div class="stat-card">
            <div class="stat-label">
                Possible
            </div>

            <div
                class="stat-value possible"
                id="possible"
            >
                —
            </div>
        </div>

    </div>


    <!-- ===================================================== -->
    <!-- FILTERS -->
    <!-- ===================================================== -->

    <div class="filters">

        <div class="filter-grid">

            <input
                type="text"
                id="search"
                placeholder="Search company name or ABN..."
            >
            <select id="country">

                <option value="">
                    All Countries
                </option>

                <option value="Australia">
                    Australia
                </option>

             </select>

            <select id="state">

                <option value="">
                    All States
                </option>

                <option value="NSW">
                    NSW
                </option>

                <option value="VIC">
                    VIC
                </option>

                <option value="QLD">
                    QLD
                </option>

                <option value="WA">
                    WA
                </option>

                <option value="SA">
                    SA
                </option>

                <option value="TAS">
                    TAS
                </option>

                <option value="ACT">
                    ACT
                </option>

                <option value="NT">
                    NT
                </option>

            </select>


            <select id="classification">

                <option value="">
                    All Classifications
                </option>

                <option value="High potential">
                    High Potential
                </option>

                <option value="Good potential">
                    Good Potential
                </option>

                <option value="Possible">
                    Possible
                </option>

            </select>


            <input
                type="number"
                id="minimumScore"
                min="0"
                placeholder="Minimum score"
            >


            <button
                onclick="loadLeads()"
            >
                Search
            </button>

        </div>

    </div>


    <div id="error"></div>


    <!-- ===================================================== -->
    <!-- RESULTS -->
    <!-- ===================================================== -->

    <div class="results-header">

        <div>
            <strong>
                Lead Candidates
            </strong>
        </div>

        <div
            class="results-count"
            id="resultsCount"
        >
            Loading...
        </div>

    </div>


    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>
                        Company
                    </th>

                    <th>
                        ABN
                    </th>

                    <th>
                        State
                    </th>

                    <th>
                        Score
                    </th>

                    <th>
                        Classification
                    </th>

                    <th>
                        Action
                    </th>

                </tr>

            </thead>

            <tbody id="leadsTable">

                <tr>
                    <td
                        colspan="7"
                        class="loading"
                    >
                        Loading leads...
                    </td>
                </tr>

            </tbody>

        </table>

    </div>
    <div 
         id="pagination"
         class="pagination"

></div>


<!-- ========================================================= -->
<!-- LEAD DETAILS MODAL -->
<!-- ========================================================= -->

<div
    class="modal-overlay"
    id="leadModal"
>

    <div class="modal">

        <div class="modal-header">

            <div>
                <h2 id="modalCompany">
                    Lead Details
                </h2>
            </div>

            <button
                class="close-button"
                onclick="closeLead()"
            >
                Close
            </button>

        </div>


        <div id="leadDetails">

            Loading...

        </div>

    </div>

</div>


<script>

const API_BASE = "/api/v1";
const DASHBOARD_API_BASE = "/api/v1/dashboard";

/* ============================================================
   HELPERS
   ============================================================ */

function escapeHtml(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}


function classificationClass(classification) {

    if (classification === "High potential") {
        return "badge badge-high";
    }

    if (classification === "Good potential") {
        return "badge badge-good";
    }

    return "badge badge-possible";
}


/* ============================================================
   LOAD STATS
   ============================================================ */

async function loadStats() {

    try {

        const response = await fetch(
            `${DASHBOARD_API_BASE}/stats`
        );

        if (!response.ok) {
            throw new Error(
                "Failed to load dashboard statistics"
            );
        }

        const data = await response.json();


        document.getElementById(
            "totalCandidates"
        ).textContent =
            data.total_candidates.toLocaleString();


        document.getElementById(
            "highPotential"
        ).textContent =
            data.high_potential.toLocaleString();


        document.getElementById(
            "goodPotential"
        ).textContent =
            data.good_potential.toLocaleString();


        document.getElementById(
            "possible"
        ).textContent =
            data.possible.toLocaleString();


    } catch (error) {

        console.error(
            "Dashboard statistics error:",
            error
        );

    }

}

/* ============================================================
   LOAD LEADS
   ============================================================ */

let currentPage = 1;
const pageSize = 20;

async function loadLeads() {

    const table =
        document.getElementById(
            "leadsTable"
        );

    table.innerHTML = `
        <tr>
            <td
                colspan="6"
                class="loading"
            >
                Loading leads...
            </td>
        </tr>
    `;


    const search =
        document.getElementById(
            "search"
        ).value.trim();


    const state =
        document.getElementById(
            "state"
        ).value;
   
   const country =
       document.getElementById(
           "country"
       ).value;

    const classification =
        document.getElementById(
            "classification"
        ).value;


const minimumScore =
    document.getElementById(
        "minimumScore"
    ).value;


const params =
    new URLSearchParams();


if (search) {
    params.append(
        "search",
        search
    );
}


if (state) {
    params.append(
        "state",
        state
    );
}

if (country) {
    params.append(
        "country",
        country
    );
}


if (classification) {
    params.append(
        "classification",
        classification
    );
}


if (minimumScore) {
    params.append(
        "min_score",
        minimumScore
    );
}


params.append(
    "page",
    currentPage.toString()
);


params.append(
    "page_size",
    pageSize.toString()
);


try {

    const response = await fetch(
        `${API_BASE}/leads?${params.toString()}`
    );

        if (!response.ok) {

            throw new Error(
                "Failed to load leads"
            );

        }


        const data =
            await response.json();


        renderLeads(
            data.items
        );
        renderPagination(
            data.page,
            data.pages,
            data.total
        );

        document.getElementById(
            "resultsCount"
        ).textContent =
            `${data.total.toLocaleString()} leads found`;

    }

    catch (error) {

        table.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="empty"
                >
                    Unable to load leads
                </td>
            </tr>
        `;

        showError(
            error.message
        );

    }

}

function renderPagination(
    page,
    pages,
    total
) {

    const pagination =
        document.getElementById(
            "pagination"
        );

    if (!pagination) {
        return;
    }

    if (pages <= 1) {
        pagination.innerHTML = "";
        return;
    }

    pagination.innerHTML = `
        <button
            onclick="goToPage(${page - 1})"
            ${page <= 1 ? "disabled" : ""}
        >
            ← Previous
        </button>

        <span>
            Page ${page} of ${pages}
        </span>

        <button
            onclick="goToPage(${page + 1})"
            ${page >= pages ? "disabled" : ""}
        >
            Next →
        </button>
    `;
}

function goToPage(page) {

    currentPage = page;

    loadLeads();
}


/* ============================================================
   RENDER LEADS
   ============================================================ */

function renderLeads(leads) {

    const table =
        document.getElementById(
            "leadsTable"
        );


    if (!leads.length) {

        table.innerHTML = `
            <tr>
                <td
                    colspan="6"
                    class="empty"
                >
                    No leads found
                </td>
            </tr>
        `;

        return;

    }


    table.innerHTML =
        leads.map(
            lead => `

                <tr>

                    <td class="company">
                        ${escapeHtml(
                            lead.company_name
                        )}
                    </td>


                    <td>
                        ${escapeHtml(
                            lead.abn
                        )}
                    </td>
                    <td>
                        ${escapeHtml(
                            lead.country || "-"
                        )}
                    </td>

                    <td>
                        ${escapeHtml(
                            lead.state || "-"
                        )}
                    </td>


                    <td class="score">
                        ${lead.lead_score}
                    </td>


                    <td>

                        <span
                            class="${classificationClass(
                                lead.classification
                            )}"
                        >
                            ${escapeHtml(
                                lead.classification
                            )}
                        </span>

                    </td>


                    <td>

                        <button
                            class="open-button"
                            onclick="openLead(${lead.id})"
                        >
                            Open →
                        </button>

                    </td>

                </tr>

            `
        ).join("");

}


/* ============================================================
   OPEN LEAD
   ============================================================ */

async function openLead(id) {

    const modal =
        document.getElementById(
            "leadModal"
        );


    const details =
        document.getElementById(
            "leadDetails"
        );


    modal.classList.add(
        "active"
    );


    details.innerHTML =
        `<div class="loading">
            Loading lead...
        </div>`;


    try {

        const response =
            await fetch(
                `${API_BASE}/leads/${id}`
            );


        if (!response.ok) {

            throw new Error(
                "Lead not found"
            );

        }


        const lead =
            await response.json();


        document.getElementById(
            "modalCompany"
        ).textContent =
            lead.company_name;


        renderLeadDetails(
            lead
        );

    }

    catch (error) {

        details.innerHTML =
            `<div class="error">
                ${escapeHtml(
                    error.message
                )}
            </div>`;

    }

}


/* ============================================================
   RENDER LEAD DETAILS
   ============================================================ */

function renderLeadDetails(lead) {

    const details =
        document.getElementById(
            "leadDetails"
        );


    details.innerHTML = `

        <div class="detail-grid">

            <div class="detail">

                <div class="detail-label">
                    Lead Score
                </div>

                <div class="detail-value">
                    ${lead.lead_score}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    Classification
                </div>

                <div class="detail-value">

                    <span
                        class="${classificationClass(
                            lead.classification
                        )}"
                    >
                        ${escapeHtml(
                            lead.classification
                        )}
                    </span>

                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    ABN
                </div>

                <div class="detail-value">
                    ${escapeHtml(
                        lead.abn
                    )}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    ABN Status
                </div>

                <div class="detail-value">
                    ${escapeHtml(
                        lead.status || "-"
                    )}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    GST Status
                </div>

                <div class="detail-value">
                    ${escapeHtml(
                        lead.gst_status || "-"
                    )}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    Entity Type
                </div>

                <div class="detail-value">
                    ${escapeHtml(
                        lead.entity_type || "-"
                    )}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    State
                </div>

                <div class="detail-value">
                    ${escapeHtml(
                        lead.state || "-"
                    )}
                </div>

            </div>


            <div class="detail">

                <div class="detail-label">
                    Postcode
                </div>

                <div class="detail-value">
                    ${escapeHtml(
                        lead.postcode || "-"
                    )}
                </div>

            </div>

        </div>


        <div class="lead-section">

            <h3>
                Lead Signals
            </h3>

            <div class="signals">

                ${escapeHtml(
                    lead.positive_signals || "None"
                )}

            </div>

        </div>


        <div class="lead-section">

            <h3>
                Negative Signals
            </h3>

            <div class="signals">

                ${escapeHtml(
                    lead.negative_signals || "None"
                )}

            </div>

        </div>


        <div class="lead-section">

            <h3>
                Contact Information
            </h3>

            <div class="detail-grid">

                <div class="detail">

                    <div class="detail-label">
                        Website
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            lead.website || "-"
                        )}
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Email
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            lead.email || "-"
                        )}
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Phone
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            lead.phone || "-"
                        )}
                    </div>

                </div>

            </div>

        </div>


        <div class="lead-section">

            <h3>
                Buyer Intelligence
            </h3>

            <div class="detail-grid">

                <div class="detail">

                    <div class="detail-label">
                        Buyer Type
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            lead.buyer_type || "-"
                        )}
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Import Activity
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            lead.import_activity || "-"
                        )}
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        India Sourcing
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            lead.india_sourcing || "-"
                        )}
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Bulk Buyer
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            lead.bulk_buyer || "-"
                        )}
                    </div>

                </div>


                <div class="detail">

                    <div class="detail-label">
                        Verification Status
                    </div>

                    <div class="detail-value">
                        ${escapeHtml(
                            lead.verification_status || "unverified"
                        )}
                    </div>

                </div>

            </div>

        </div>

    `;

}


/* ============================================================
   CLOSE LEAD
   ============================================================ */

function closeLead() {

    document
        .getElementById(
            "leadModal"
        )
        .classList.remove(
            "active"
        );

}


/* ============================================================
   ERROR
   ============================================================ */

function showError(message) {

    const element =
        document.getElementById(
            "error"
        );

    element.innerHTML =
        `<div class="error">
            ${escapeHtml(message)}
        </div>`;

}


/* ============================================================
   INITIAL LOAD
   ============================================================ */

async function initializeDashboard() {

    await loadStats();

    await loadLeads();

}


initializeDashboard();


/* ============================================================
   ENTER KEY SEARCH
   ============================================================ */

document
    .getElementById("search")
    .addEventListener(
        "keydown",
        function(event) {

            if (event.key === "Enter") {
                loadLeads();
            }

        }
    );


/* ============================================================
   CLOSE MODAL WHEN CLICKING OUTSIDE
   ============================================================ */

document
    .getElementById("leadModal")
    .addEventListener(
        "click",
        function(event) {

            if (
                event.target === this
            ) {
                closeLead();
            }

        }
    );

</script>

</body>
</html>
