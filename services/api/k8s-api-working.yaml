apiVersion: apps/v1
kind: Deployment
metadata:
  name: lead-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lead-api
  template:
    metadata:
      labels:
        app: lead-api
    spec:
      containers:
        - name: lead-api
          image: moringa-lead-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          env:
            - name: APP_NAME
              value: "Global Moringa Distributor Intelligence Platform"

            - name: APP_VERSION
              value: "0.1.0"

            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_DB

            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER

            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD

            - name: DATABASE_URL
              value: "postgresql://lead_user:lead_password@postgres:5432/lead_platform"

---
apiVersion: v1
kind: Service
metadata:
  name: lead-api
spec:
  selector:
    app: lead-api
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
